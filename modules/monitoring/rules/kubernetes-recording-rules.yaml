# Kubernetes recording rules (same set the AKS portal installs), with `cluster` in every
# by/on clause so series from different clusters in the shared workspace never get merged.
description: Kubernetes recording rules for all clusters (cAdvisor + kube-state-metrics).
rules:
  - record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate
    expr: >-
      sum by (cluster, namespace, pod, container) (irate(container_cpu_usage_seconds_total{job="cadvisor", image!=""}[5m]))
      * on (cluster, namespace, pod) group_left(node)
      topk by (cluster, namespace, pod) (1, max by (cluster, namespace, pod, node) (kube_pod_info{node!=""}))
  - record: node_namespace_pod_container:container_memory_working_set_bytes
    expr: >-
      container_memory_working_set_bytes{job="cadvisor", image!=""}
      * on (cluster, namespace, pod) group_left(node)
      topk by (cluster, namespace, pod) (1, max by (cluster, namespace, pod, node) (kube_pod_info{node!=""}))
  - record: node_namespace_pod_container:container_memory_rss
    expr: >-
      container_memory_rss{job="cadvisor", image!=""}
      * on (cluster, namespace, pod) group_left(node)
      topk by (cluster, namespace, pod) (1, max by (cluster, namespace, pod, node) (kube_pod_info{node!=""}))
  - record: node_namespace_pod_container:container_memory_cache
    expr: >-
      container_memory_cache{job="cadvisor", image!=""}
      * on (cluster, namespace, pod) group_left(node)
      topk by (cluster, namespace, pod) (1, max by (cluster, namespace, pod, node) (kube_pod_info{node!=""}))
  - record: node_namespace_pod_container:container_memory_swap
    expr: >-
      container_memory_swap{job="cadvisor", image!=""}
      * on (cluster, namespace, pod) group_left(node)
      topk by (cluster, namespace, pod) (1, max by (cluster, namespace, pod, node) (kube_pod_info{node!=""}))

  - record: cluster:namespace:pod_memory:active:kube_pod_container_resource_requests
    expr: >-
      kube_pod_container_resource_requests{resource="memory", job="kube-state-metrics"}
      * on (cluster, namespace, pod) group_left()
      max by (cluster, namespace, pod) ((kube_pod_status_phase{phase=~"Pending|Running"} == 1))
  - record: namespace_memory:kube_pod_container_resource_requests:sum
    expr: >-
      sum by (cluster, namespace) (sum by (cluster, namespace, pod) (
        max by (cluster, namespace, pod, container) (kube_pod_container_resource_requests{resource="memory", job="kube-state-metrics"})
        * on (cluster, namespace, pod) group_left()
        max by (cluster, namespace, pod) (kube_pod_status_phase{phase=~"Pending|Running"} == 1)
      ))
  - record: cluster:namespace:pod_cpu:active:kube_pod_container_resource_requests
    expr: >-
      kube_pod_container_resource_requests{resource="cpu", job="kube-state-metrics"}
      * on (cluster, namespace, pod) group_left()
      max by (cluster, namespace, pod) ((kube_pod_status_phase{phase=~"Pending|Running"} == 1))
  - record: namespace_cpu:kube_pod_container_resource_requests:sum
    expr: >-
      sum by (cluster, namespace) (sum by (cluster, namespace, pod) (
        max by (cluster, namespace, pod, container) (kube_pod_container_resource_requests{resource="cpu", job="kube-state-metrics"})
        * on (cluster, namespace, pod) group_left()
        max by (cluster, namespace, pod) (kube_pod_status_phase{phase=~"Pending|Running"} == 1)
      ))
  - record: cluster:namespace:pod_memory:active:kube_pod_container_resource_limits
    expr: >-
      kube_pod_container_resource_limits{resource="memory", job="kube-state-metrics"}
      * on (cluster, namespace, pod) group_left()
      max by (cluster, namespace, pod) ((kube_pod_status_phase{phase=~"Pending|Running"} == 1))
  - record: namespace_memory:kube_pod_container_resource_limits:sum
    expr: >-
      sum by (cluster, namespace) (sum by (cluster, namespace, pod) (
        max by (cluster, namespace, pod, container) (kube_pod_container_resource_limits{resource="memory", job="kube-state-metrics"})
        * on (cluster, namespace, pod) group_left()
        max by (cluster, namespace, pod) (kube_pod_status_phase{phase=~"Pending|Running"} == 1)
      ))
  - record: cluster:namespace:pod_cpu:active:kube_pod_container_resource_limits
    expr: >-
      kube_pod_container_resource_limits{resource="cpu", job="kube-state-metrics"}
      * on (cluster, namespace, pod) group_left()
      max by (cluster, namespace, pod) ((kube_pod_status_phase{phase=~"Pending|Running"} == 1))
  - record: namespace_cpu:kube_pod_container_resource_limits:sum
    expr: >-
      sum by (cluster, namespace) (sum by (cluster, namespace, pod) (
        max by (cluster, namespace, pod, container) (kube_pod_container_resource_limits{resource="cpu", job="kube-state-metrics"})
        * on (cluster, namespace, pod) group_left()
        max by (cluster, namespace, pod) (kube_pod_status_phase{phase=~"Pending|Running"} == 1)
      ))

  - record: namespace_workload_pod:kube_pod_owner:relabel
    labels: { workload_type: deployment }
    expr: >-
      max by (cluster, namespace, workload, pod) (
        label_replace(
          label_replace(kube_pod_owner{job="kube-state-metrics", owner_kind="ReplicaSet"}, "replicaset", "$1", "owner_name", "(.*)")
          * on (cluster, replicaset, namespace) group_left(owner_name)
          topk by (cluster, replicaset, namespace) (1, max by (cluster, replicaset, namespace, owner_name) (kube_replicaset_owner{job="kube-state-metrics"})),
          "workload", "$1", "owner_name", "(.*)"
        )
      )
  - record: namespace_workload_pod:kube_pod_owner:relabel
    labels: { workload_type: daemonset }
    expr: >-
      max by (cluster, namespace, workload, pod) (
        label_replace(kube_pod_owner{job="kube-state-metrics", owner_kind="DaemonSet"}, "workload", "$1", "owner_name", "(.*)")
      )
  - record: namespace_workload_pod:kube_pod_owner:relabel
    labels: { workload_type: statefulset }
    expr: >-
      max by (cluster, namespace, workload, pod) (
        label_replace(kube_pod_owner{job="kube-state-metrics", owner_kind="StatefulSet"}, "workload", "$1", "owner_name", "(.*)")
      )
  - record: namespace_workload_pod:kube_pod_owner:relabel
    labels: { workload_type: job }
    expr: >-
      max by (cluster, namespace, workload, pod) (
        label_replace(kube_pod_owner{job="kube-state-metrics", owner_kind="Job"}, "workload", "$1", "owner_name", "(.*)")
      )

  - record: ":node_memory_MemAvailable_bytes:sum"
    expr: >-
      sum by (cluster) (node_memory_MemAvailable_bytes{job="node"}
        or (node_memory_Buffers_bytes{job="node"} + node_memory_Cached_bytes{job="node"} + node_memory_MemFree_bytes{job="node"} + node_memory_Slab_bytes{job="node"}))
  - record: cluster:node_cpu:ratio_rate5m
    expr: >-
      sum by (cluster) (rate(node_cpu_seconds_total{job="node", mode!="idle", mode!="iowait", mode!="steal"}[5m]))
      / count by (cluster) (sum by (cluster, instance, cpu) (node_cpu_seconds_total{job="node"}))
