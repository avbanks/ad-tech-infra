# dev/as wave-2: centralindia cells 02-03 (6 clusters). Promoted by PR after wave-1 bakes.
# One key per HelmRelease in k8s/base. Promotion = changing a number here (direct push for wave-1,
# PR for later waves). Every cluster whose Flux "wave" Kustomization points at this directory follows.
apiVersion: v1
kind: ConfigMap
metadata:
  name: versions
  namespace: flux-system
data:
  # ours (k8s/charts, published to ACR)
  AMA_METRICS_SETTINGS_VERSION: "0.1.0"
  KAFKA_STACK_VERSION: "0.1.0"
  FLINK_STACK_VERSION: "0.1.0"
  INGEST_STACK_VERSION: "0.1.0"
  # upstream
  CERT_MANAGER_VERSION: "v1.21.3"
  FLINK_OPERATOR_VERSION: "1.16.1"
