# prod (not applied anywhere yet): three nodes, RF 3. Separate controller/broker pools and zones
# still need the dedicated node pools from the "Next steps" list before this is usable.
nodePool:
  replicas: 3
  storage:
    size: 200Gi
  resources:
    requests: { cpu: "2", memory: 8Gi }
    limits: { memory: 8Gi }
  jvmOptions:
    -Xms: 4096m
    -Xmx: 4096m
replicationFactor: 3
minInsyncReplicas: 2
