{{- range .Values.topics }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ .name }}
  labels:
    strimzi.io/cluster: {{ $.Values.clusterName }}
spec:
  partitions: {{ .partitions }}
  replicas: {{ $.Values.replicationFactor }}
  config:
    retention.ms: {{ .retentionMs | int64 }}
{{- end }}
