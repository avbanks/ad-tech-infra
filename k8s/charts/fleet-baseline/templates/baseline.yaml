# Things every cluster should have regardless of role. Helmfile on the members owns role-specific
# workloads; Fleet owns this cross-cutting baseline so it can't drift across ~18 clusters.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    adtech.io/managed-by: fleet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-info
  namespace: {{ .Values.namespace }}
data:
  environment: {{ .Values.environment | quote }}
  continent: {{ .Values.continent | quote }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: adtech-streaming-critical
value: 1000000
globalDefault: false
description: Kafka brokers and Flink JobManagers - evicted last.
---
apiVersion: placement.kubernetes-fleet.io/v1
kind: ClusterResourcePlacement
metadata:
  name: adtech-baseline
spec:
  resourceSelectors:
    - group: ""
      version: v1
      kind: Namespace
      name: {{ .Values.namespace }}
    - group: scheduling.k8s.io
      version: v1
      kind: PriorityClass
      name: adtech-streaming-critical
  policy:
    placementType: PickAll
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
